[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-grid-local"
version = "1.0.0"
description = "Local multi-asset technical charts with an independent Python backend"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
market-grid = "market_grid.server:main"

[tool.setuptools.packages.find]
include = ["market_grid*"]

[tool.setuptools.package-data]
market_grid = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
